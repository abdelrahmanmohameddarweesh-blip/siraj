<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a24">
<title>سراج | واحتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe5cf; --surface:#fbf6ea; --surface-2:#f5ecd9; --ink:#1f2a24; --muted:#6c6857;
  --line:#e2d4b5; --brass:#a5701c; --brass-soft:#f1dfb6; --emerald:#1d5c49; --on-emerald:#fff;
  --toast-bg:#1c2b26; --toast-ink:#fff; --glass:rgba(16,26,22,.5); --dh:150px;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1c19; --surface:#152b26; --surface-2:#1b352f; --ink:#efe6d2; --muted:#a7b1a3;
    --line:#26453d; --brass:#e2b462; --brass-soft:#3a321f; --emerald:#2f8b6c; --on-emerald:#fff;
    --toast-bg:#f1e7d0; --toast-ink:#1c2b26; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1c19; --surface:#152b26; --surface-2:#1b352f; --ink:#efe6d2; --muted:#a7b1a3;
  --line:#26453d; --brass:#e2b462; --brass-soft:#3a321f; --emerald:#2f8b6c; --on-emerald:#fff;
  --toast-bg:#f1e7d0; --toast-ink:#1c2b26; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#0b1714;color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,label:focus-within{outline:3px solid var(--brass);outline-offset:2px}

/* full-screen game */
.game{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;overflow:hidden;background:#cfe3e6;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.scene{position:absolute;inset:0}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas.layer,#tint{pointer-events:none}
#tint{transition:background-color 1.2s ease}

.hud{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none;z-index:5}
.hud-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.hud-row2{display:flex;align-items:flex-start;justify-content:space-between;margin-top:8px}
.glass{background:var(--glass);color:#fff;-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);border:1px solid rgba(255,255,255,.14)}
.loc{pointer-events:auto;border-radius:16px;padding:7px 12px 8px;min-width:150px}
.loc b{display:block;font-size:15px;line-height:1.3}
.loc .lrow{display:flex;align-items:center;gap:8px;margin-top:4px}
.locbar{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}
.locbar i{display:block;height:100%;background:#f1c76a;border-radius:5px;transition:width .6s ease}
.loc span{font-size:11px;opacity:.85;white-space:nowrap}
.icons{display:flex;gap:6px}
.round{pointer-events:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.round svg{width:19px;height:19px}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px 5px 8px;font-weight:700;font-size:15px}
.pill svg{width:22px;height:22px}
.side{display:flex;flex-direction:column;gap:8px}
.side .round{width:52px;height:52px;border-radius:16px;flex-direction:column;gap:0;font-size:10px;font-weight:600}
.side .round svg{width:22px;height:22px}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 124px);margin:0;display:flex;gap:8px;align-items:center;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:4;transition:opacity .3s}
.hint svg{flex:none;width:15px;height:15px;color:#f1c76a}
.hint span{overflow:hidden;text-overflow:ellipsis}
.visit{position:absolute;top:calc(env(safe-area-inset-top,0px) + 166px);inset-inline:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:14px;padding:8px 12px;font-size:13px;z-index:5}
.visit[hidden]{display:none}
.visit button{background:#fff;color:#1d5c49;border:0;border-radius:10px;padding:6px 10px;font-weight:600;font-size:13px;cursor:pointer}

.tools{position:absolute;inset-inline-end:14px;bottom:calc(var(--dh) - 30px);display:flex;gap:10px;z-index:8;transition:bottom .3s ease}
.tool{position:relative;width:62px;height:62px;border-radius:20px;box-shadow:0 8px 18px -8px rgba(0,0,0,.5);display:grid;place-items:center;touch-action:none;cursor:grab}
.tool svg{width:46px;height:46px}
.tool .badge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:24px;height:24px;border-radius:12px;background:#f1c76a;color:#3a2a08;font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 6px;border:2px solid rgba(0,0,0,.15)}
.tool.empty{opacity:.55}
.tool.empty .badge{background:#d8d2c4}
.tool.ready{animation:ready 2.2s ease-in-out infinite}
@keyframes ready{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tool .lbl{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:10px;color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

.drawer{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -10px 30px -12px rgba(0,0,0,.35);padding-bottom:env(safe-area-inset-bottom,0px)}
.handle{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;padding:16px 18px 8px;padding-inline-end:160px;cursor:pointer;position:relative;text-align:start;touch-action:none}
.grip{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:4px;background:var(--line)}
.dh{flex:1}
.dh b{display:block;font-size:16px}
.dh span{font-size:12px;color:var(--muted)}
.ring{width:42px;height:42px;flex:none}
.ring svg{width:100%;height:100%}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .25s}
.drawer.open .chev{transform:rotate(180deg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-h{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:62px;background:transparent;border:0;cursor:pointer;padding:0}
.chip-h .cc{width:46px;height:46px;border-radius:50%;border:2px solid var(--emerald);display:grid;place-items:center;background:var(--surface-2);position:relative}
.chip-h .cc .gi{width:22px;height:22px}
.chip-h .cc .gi svg{width:100%;height:100%}
.chip-h .cc .ck{display:none;width:22px;height:22px}
.chip-h[aria-checked="true"] .cc{background:var(--emerald)}
.chip-h[aria-checked="true"] .cc .gi{display:none}
.chip-h[aria-checked="true"] .cc .ck{display:block}
.chip-h small{font-size:11px;font-weight:600;white-space:nowrap}
.chip-h[aria-checked="true"] small{color:var(--muted)}
.list{display:none;max-height:min(52vh,460px);overflow:auto;padding:0 12px 6px}
.drawer.open .list{display:block}
.drawer.open .chips{display:none}
.dfoot{display:none;padding:4px 16px 14px;text-align:center}
.drawer.open .dfoot{display:block}
.group{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.group h3{margin:0;padding:10px 16px 2px;font-size:12px;color:var(--muted);font-weight:600}
.habit{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;background:transparent;border:0;text-align:start;cursor:pointer}
.habit+.habit{border-top:1px solid var(--line)}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--emerald);display:grid;place-items:center;transition:background .2s}
.check svg{width:16px;height:16px;opacity:0}
.habit[aria-checked="true"] .check{background:var(--emerald)}
.habit[aria-checked="true"] .check svg{opacity:1}
.habit .txt{flex:1}
.habit .name{font-weight:600;display:block}
.habit .sub{font-size:12px;color:var(--muted)}
.habit[aria-checked="true"] .name{color:var(--muted)}
.gain{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.gain svg{width:15px;height:15px}
.ghost-btn{background:transparent;border:1px dashed var(--brass);color:var(--brass);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer}

.fly{position:fixed;z-index:95;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.fly svg{width:100%;height:100%}

.page{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;z-index:45;background:var(--bg);display:flex;flex-direction:column;animation:up .3s ease}
.page[hidden]{display:none}
.page-head{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px}
.page-head h2{margin:0;font-size:22px}
.page-head .round{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.page-body{flex:1;overflow:auto;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 24px)}
.page-body>p{margin:0 6px 16px;color:var(--muted);font-size:14px}
.journey{list-style:none;margin:0;padding:0}
.journey li{position:relative;padding-inline-start:30px;margin-bottom:14px}
.journey li::before{content:"";position:absolute;inset-inline-start:9px;top:22px;bottom:-22px;border-inline-start:2px dotted var(--brass);opacity:.6}
.journey li:last-child::before{display:none}
.journey .dot{position:absolute;inset-inline-start:0;top:14px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--brass);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--brass)}
.journey .done .dot{background:var(--brass);color:#fff}
.journey .current .dot{background:var(--emerald);border-color:var(--emerald);color:#fff}
.stop{display:flex;gap:12px;width:100%;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;text-align:start;cursor:pointer}
.stop:disabled{cursor:default;opacity:.75}
.thumb{flex:none;width:104px;aspect-ratio:4/3;border-radius:11px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.thumb svg{display:block;width:100%;height:100%}
.thumb.locked svg{width:28px;height:28px;opacity:.5}
.stop b{display:block;font-size:15px}
.stop span{display:block;font-size:12px;color:var(--muted)}
.stop .status{color:var(--emerald);font-weight:600}
.menu-list{display:grid;gap:8px;margin:10px 0 4px}
.menu-list button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600}
.menu-list button span{display:block;font-size:12px;font-weight:400;color:var(--muted)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 168px);transform:translate(-50%,-10px);background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:40;max-width:min(440px,calc(100% - 32px));text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#ghost{position:fixed;z-index:70;width:64px;height:64px;pointer-events:none;transform:translate(-50%,-50%);left:-200px;top:-200px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
#ghost svg{width:100%;height:100%;transition:transform .18s ease;transform-origin:50% 50%}
#ghost.tilt svg{transform:rotate(-25deg)}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(8,14,12,.5)}
.sheet-body{position:relative;width:100%;max-width:460px;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-body h2{margin:0 0 6px;font-size:20px}
.sheet-body p{margin:0 0 14px;color:var(--muted)}
.primary,.secondary{display:block;width:100%;border-radius:14px;padding:13px;font-weight:600;cursor:pointer;font-size:15px;text-align:center}
.primary{background:var(--emerald);color:var(--on-emerald);border:0}
.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.picker button{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.picker svg{width:64px;height:68px}
.picker b{font-size:14px}
.picker .new{position:absolute;top:6px;inset-inline-start:6px;font-size:10px;background:var(--brass);color:#fff;border-radius:6px;padding:0 5px}
.ayah{font-family:Amiri,"Traditional Arabic",serif;font-size:23px;line-height:2;text-align:center;margin:8px 0 2px;color:var(--ink)}
.ref{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.plant-hero{display:flex;justify-content:center}
.plant-hero svg{width:130px;height:138px}
.celebrate{text-align:center}
.celebrate .glow{width:120px;height:140px;margin:0 auto 8px;display:block}
.mini{border-radius:16px;overflow:hidden;aspect-ratio:4/3;margin-bottom:14px}
.mini svg{display:block;width:100%;height:100%}
.steps{list-style:none;padding:0;margin:14px 0 18px}
.steps li{display:flex;gap:12px;align-items:center;padding:8px 0}
.steps svg{width:30px;height:30px;flex:none}
.card{border-radius:22px;overflow:hidden;background:linear-gradient(#123b33,#0d2722);color:#f6ecd4;padding:16px 16px 20px;text-align:center;margin-bottom:14px}
.card .mini{margin-bottom:12px}
.card h3{margin:0;font-size:19px}
.card .plants{font-size:13px;opacity:.8;margin:4px 0 10px}
.card .ayah{color:#f6ecd4;font-size:20px}
.card .tag{font-size:13px;color:#e2b462;margin-top:6px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}

.studio h3{font-size:14px;margin:18px 0 8px;color:var(--muted)}
.slot{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.slot .sthumb{flex:none;width:56px;height:56px;border-radius:12px;background:var(--surface-2) center/contain no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px}
.slot .sthumb.bg{background-size:cover}
.slot .info{flex:1;min-width:0}
.slot b{display:block;font-size:14px}
.slot .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.slot .acts button,.slot .acts label{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 9px;cursor:pointer;font-weight:600}
.slot .acts label{border-color:var(--emerald);color:var(--emerald)}
.slot input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.slot details{margin-top:6px;font-size:12px;color:var(--muted)}
.slot details p{direction:ltr;text-align:left;margin:6px 0 0;font-size:12px;line-height:1.5;background:var(--surface-2);padding:8px;border-radius:8px;color:var(--ink);user-select:text;-webkit-user-select:text}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;margin:8px 0}
.toggle input{width:20px;height:20px;accent-color:var(--emerald)}

.notif{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-150%);width:min(440px,calc(100% - 16px));z-index:90;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 14px 12px;box-shadow:0 16px 36px -14px rgba(0,0,0,.5);cursor:pointer;transition:transform .4s cubic-bezier(.2,1.25,.3,1)}
.notif[hidden]{display:none}
.notif.in{transform:translate(-50%,0)}
.notif.out{transform:translate(-50%,-150%);transition-timing-function:ease-in}
.n-app{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.n-ic{width:18px;height:18px;border-radius:5px;background:var(--emerald);display:grid;place-items:center}
.n-ic svg{width:13px;height:13px}
.n-time{margin-inline-start:auto;font-weight:500}
.n-row{display:flex;gap:10px;align-items:center;margin-top:6px}
.n-emoji{font-size:30px;line-height:1}
.n-row b{display:block;font-size:15px}
.n-row span{display:block;font-size:13px;color:var(--muted)}
.residents{margin:26px 0 8px}
.rhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 8px}
.rhead h2{font-size:20px;margin:0}
.rhead span{font-size:13px;color:var(--brass);font-weight:600}
.residents>p{margin:4px 8px 12px;color:var(--muted);font-size:14px}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:start;cursor:pointer;display:flex;gap:10px;align-items:center}
.rcard .em{font-size:28px;line-height:1}
.rcard.locked .em{filter:grayscale(1) brightness(.35);opacity:.45}
.rcard b{display:block;font-size:14px}
.rcard span{display:block;font-size:11px;color:var(--muted);line-height:1.4}
.big-emoji{font-size:64px;text-align:center;line-height:1.2}
.pk-h{font-size:13px;color:var(--muted);margin:16px 0 0}
.picker button:disabled{opacity:.5;cursor:default;filter:saturate(.4)}
.picker .lockt{font-size:10px;color:var(--muted);line-height:1.3}
.peck{transform-box:fill-box;transform-origin:85% 85%;animation:peck 3.4s ease-in-out infinite}
@keyframes peck{0%,68%,100%{transform:rotate(0)}76%{transform:rotate(-30deg)}84%{transform:rotate(0)}90%{transform:rotate(-24deg)}96%{transform:rotate(0)}}
/* scene animation */
.gr,.gw,.sway{transform-box:fill-box;transform-origin:50% 100%}
.pop{animation:pop .65s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.15);opacity:.3}100%{transform:scale(1);opacity:1}}
.grow{animation:grow 1.5s cubic-bezier(.2,1.2,.3,1)}
@keyframes grow{0%{transform:scale(.4);opacity:.4}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
.sway{animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.gusting .gw{animation:gust 2.6s ease-in-out}
@keyframes gust{0%{transform:rotate(0)}22%{transform:rotate(5deg)}45%{transform:rotate(2.2deg)}66%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.gw.rustle{animation:rustle .6s ease-in-out}
@keyframes rustle{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}45%{transform:rotate(4deg)}70%{transform:rotate(-2.5deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.25);opacity:.6}}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
.drink{transform-box:fill-box;transform-origin:80% 60%;animation:drink 4s ease-in-out infinite}
@keyframes drink{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-6deg)}}
.flicker{animation:flicker 2.8s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.85}45%{opacity:1}60%{opacity:.75}}
.tap{cursor:pointer}
@media (prefers-reduced-motion: reduce){
  .pop,.grow,.sway,.gw,.pulse,.bob,.drink,.flicker,.bump,.sheet-body,.purse .ic,.peck{animation:none!important}
  .notif{transition:none}
}
</style>
</head>
<body>

const ART = {};
const DB = {
  db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('sirag-art',1); r.onupgradeneeded=()=>r.result.createObjectStore('art'); r.onsuccess=()=>{ this.db=r.result; res(true); }; r.onerror=()=>res(false); }catch(e){ res(false); } }); },
  all(){ return new Promise(res=>{ if(!this.db) return res({}); try{ const out={}, tx=this.db.transaction('art','readonly'), st=tx.objectStore('art'); const c=st.openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } else res(out); }; c.onerror=()=>res(out); }catch(e){ res({}); } }); },
  put(k,v){ try{ if(this.db) this.db.transaction('art','readwrite').objectStore('art').put(v,k); }catch(e){} },
  del(k){ try{ if(this.db) this.db.transaction('art','readwrite').objectStore('art').delete(k); }catch(e){} }
};

const f1 = n => (Math.round(n*10)/10).toString();
function rng(seed){ let s = (Math.imul(seed|0, 2654435761) ^ 0x9e3779b9) >>> 0; if(!s) s = 1; return ()=>{ s ^= s<<13; s>>>=0; s ^= s>>>17; s ^= s<<5; s>>>=0; return s/4294967296; }; }

  }

    for(let k=0;k<4;k++){ const s=k<2?-1:1, an={x:top.x+s*(2+r()*3), y:top.y+2+r()*2}, cc={x:an.x+s*(2+r()*3), y:an.y+7+r()*3};

function genTree(r, cfg){

  else if(cfg.shape==='shrub'){ for(let k=0;k<5;k++){ cl.push({x:(k-2)*s*.38+(r()-.5)*3, y:-h*(.55+r()*.3), rx:s*.32, ry:s*.3}); } }

    cl.forEach(c=>trunk(p,fork,{x:fork.x+(c.x-fork.x)*.45,y:fork.y+(c.y-fork.y)*.75},{x:c.x*.85,y:c.y+c.ry*.35},cfg.w0*.5,1,cfg.trunk));

  if(cfg.fruit){ for(let k=0;k<cfg.fruit.n;k++){ const c=cl[Math.floor(r()*cl.length)], a=r()*Math.PI*2, u=.35+r()*.6;

      const x=c.x+Math.cos(a)*u*c.rx, y=c.y+Math.sin(a)*u*c.ry*.9;

const POUR_MS = 1150;
function pourStep(now, dt){
  const P = W.pour, oa = cur(), p = oa.plots[P.i];
  const pp = plotPositions(LOCS[S.locIdx].plots).find(q=>q.i===P.i);
  const ok = P.i!=null && p && p.stage<2 && S.drops>0 && !isVisiting();
  if(!ok || !pp){ if(P.on){ P.on=false; AU.pour(false); $('ghost').classList.remove('tilt'); } P.prog=0; return; }
  if(!P.on){ P.on=true; AU.pour(true); $('ghost').classList.add('tilt'); }
  P.prog += dt / POUR_MS;
  const ty = pp.y - 1, tx = pp.x;
  for(let k=0;k<3;k++){ const sx=P.sx+rand(-.6,.6), sy=P.sy+rand(-.4,.4); const T=rand(220,300); const vx=(tx+rand(-3,3)-sx)/T, vy=(ty-sy)/T - .00045*T/2;
    W.parts.push({type:'water', x:sx, y:sy, vx, vy, g:.00045, life:0, max:T*1.4, r:rand(.7,1.1), rot:0, vr:0, ty}); }
  const el = document.querySelector('#mid [data-plot="'+P.i+'"] .gr'); if(el) el.style.transform = 'scale('+(1+0.1*Math.min(1,P.prog))+')';
  // progress ring

  fctx.strokeStyle='rgba(255,255,255,.35)'; fctx.lineWidth=2; fctx.beginPath(); fctx.arc(pp.x, top, 5, 0, 7); fctx.stroke();
  fctx.strokeStyle='#bfeef6'; fctx.beginPath(); fctx.arc(pp.x, top, 5, -Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(1,P.prog)); fctx.stroke();

    if(P.auto){ endPour(); }
  }
}

function processImage(file, maxDim, cut){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = ()=>{ const img = new Image(); img.onerror = rej; img.onload = ()=>{
      const sc = Math.min(1, maxDim/Math.max(img.width, img.height)); const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
      const c = document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.drawImage(img,0,0,w,h);
      if(cut){ try{ cutWhite(g, w, h); }catch(e){} }
      res(cut || /png|webp/.test(file.type) ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .86));
    }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
function cutWhite(g, w, h){
  const id = g.getImageData(0,0,w,h), d = id.data, seen = new Uint8Array(w*h), q = [];
  const isBg = i => { const r=d[i*4], gg=d[i*4+1], b=d[i*4+2]; return r>226 && gg>226 && b>226 && Math.max(r,gg,b)-Math.min(r,gg,b)<26; };
  for(let x=0;x<w;x++){ q.push(x, (h-1)*w+x); } for(let y=0;y<h;y++){ q.push(y*w, y*w+w-1); }
  while(q.length){ const i=q.pop(); if(seen[i]) continue; seen[i]=1; if(!isBg(i)) continue; d[i*4+3]=0; const x=i%w, y=(i/w)|0;
    if(x>0) q.push(i-1); if(x<w-1) q.push(i+1); if(y>0) q.push(i-w); if(y<h-1) q.push(i+w); }
  for(let i=0;i<w*h;i++){ if(d[i*4+3]===0) continue; const x=i%w, y=(i/w)|0;
    const nb = (x>0&&d[(i-1)*4+3]===0)||(x<w-1&&d[(i+1)*4+3]===0)||(y>0&&d[(i-w)*4+3]===0)||(y<h-1&&d[(i+w)*4+3]===0);
    if(nb){ const br=(d[i*4]+d[i*4+1]+d[i*4+2])/3; if(br>200) d[i*4+3]=110; } }
  g.putImageData(id,0,0);
}

/* drag from the purse */
let drag = null;
function dragStart(e){
  const el = e.currentTarget, kind = el.dataset.kind;
  if(isVisiting()){ toast('ارجع إلى واحتك الحالية لتغرس وتسقي.'); return; }
  if(kind==='seed' && S.seeds<=0){ toast(doneCount()===0 ? 'أكمل أول عادة اليوم لتحصل على بذرة.' : 'لا بذور معك الآن. بذرة جديدة غدًا.'); return; }
  if(kind==='water' && S.drops<=0){ toast('أكمل عادة لتحصل على قطرة ماء.'); return; }
  if(kind==='water' && !cur().plots.some(p=>p&&p.stage<2)){ toast('لا نبتات صغيرة تحتاج الماء الآن. اغرس بذرة أولًا.'); return; }
  e.preventDefault();
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  drag = {kind, el, x0:e.clientX, y0:e.clientY, t0:performance.now(), moved:false};
  const g=$('ghost'); g.innerHTML = kind==='seed' ? BAG : CAN; g.classList.remove('tilt');
  dragMove(e);
}
function dragMove(e){
  if(!drag) return;
  if(Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) > 6) drag.moved = true;
  const g=$('ghost'); const gx=e.clientX+(drag.kind==='water'?14:0), gy=e.clientY-50;
  g.style.left = gx+'px'; g.style.top = gy+'px';
  const pos = plotPositions(LOCS[S.locIdx].plots), oa = cur();
  if(drag.kind==='seed'){
    const pt = sceneFromClient(gx, gy+18); let best=null, bd=1e9;
    pos.forEach(pp=>{ const d=Math.hypot(pp.x-pt.x, (pp.y-pt.y)*1.3); if(d<bd){ bd=d; best=pp; } });
    if(best && bd<30){ W.hover = best.i; W.hoverOk = !oa.plots[best.i]; } else W.hover = null;
    drag.drop = pt;
  } else {
    const tip = sceneFromClient(gx-28, gy+1); let best=null, bd=1e9;
    pos.forEach(pp=>{ const dx=Math.abs(pp.x-tip.x), dy=pp.y-tip.y; if(dx<28 && dy>-10 && dy<100){ const d=dx+Math.abs(dy-38)*.3; if(d<bd){ bd=d; best=pp; } } });
    const okPlant = best && oa.plots[best.i] && oa.plots[best.i].stage<2;
    W.hover = best ? best.i : null; W.hoverOk = !!okPlant;
    if(!W.pour) W.pour = {i:null, sx:tip.x, sy:tip.y, prog:0, on:false, auto:false};
    if(W.pour.i !== (okPlant?best.i:null)) W.pour.prog = 0;
    W.pour.i = okPlant ? best.i : null; W.pour.sx = tip.x; W.pour.sy = tip.y;
  }
}
function dragEnd(){
  if(!drag) return;
  const d = drag; drag = null;
  const g=$('ghost'); g.style.left='-200px'; g.style.top='-200px'; g.classList.remove('tilt');
  const hv = W.hover, ok = W.hoverOk; W.hover = null;
  if(d.kind==='water'){ if(W.pour && !W.pour.auto){ AU.pour(false); W.pour=null; } }
  if(!d.moved && performance.now()-d.t0 < 400){ toast(d.kind==='seed' ? 'اسحب البذرة إلى بقعة فارغة في واحتك.' : 'اسحب الإبريق وأبقه فوق نبتة صغيرة.'); return; }
  if(d.kind==='seed'){
    if(hv!=null && ok) pickerSheet(hv, d.drop);
    else if(hv!=null) toast('هذه البقعة مغروسة. اختر بقعة فارغة.');
  }
}

  el.addEventListener('pointerup', dragEnd);
  el.addEventListener('pointercancel', dragEnd);
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toast(id==='cSeeds' ? 'اضغط على بقعة فارغة لتغرس بذرتك.' : 'اضغط على نبتة صغيرة لتسقيها.'); } });
});

function nextDay(){
  S.missed = doneCount()===0;
  S.done = {}; S.day++;
  save(); renderAll(); checkResidents();
  toast(S.missed ? 'أهلًا بعودتك. واحتك انتظرتك كما تركتها.' : 'يوم جديد، وبذرة جديدة مع أول عادة.');
}

/* ================= events ================= */
$('drawer').addEventListener('click', e=>{ const b=e.target.closest('[data-h]'); if(b) completeHabit(b.dataset.h, b); });
const mid = $('mid');
mid.addEventListener('click', e=>{ const g=e.target.closest('[data-plot]'); if(g) tapPlot(Number(g.dataset.plot)); });
mid.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ const g=e.target.closest('[data-plot]'); if(g){ e.preventDefault(); tapPlot(Number(g.dataset.plot)); } } });
$('timeBtn').onclick = ()=>{ const t=curTime(); S.time=TIMES[(TIMES.indexOf(t)+1)%TIMES.length]; save(); renderScene(); };
$('soundBtn').onclick = ()=>{ setSound(!(S.sound && AU.on)); toast(S.sound ? 'الصوت يعمل' : 'الصوت متوقف'); };
$('nextDayBtn').onclick = nextDay;
const demoGive = ()=>{ S.seeds+=5; S.drops+=10; save(); renderAll(); toast('أُضيفت خمس بذور وعشر قطرات للتجربة'); };
const demoFill = ()=>{
  const oa = cur(); if(oa.complete) return;
  const pool = []; for(let k=0;k<=S.locIdx;k++) pool.push(...LOCS[k].plants);
  oa.plots = oa.plots.map((p,k)=> p ? {plant:p.plant, stage:2} : {plant:pool[k%pool.length], stage:2});
  if(oa.lanterns<3) oa.lanterns = 3;
  oa.complete = true; S.viewLoc = S.locIdx; save(); renderAll(); rebuildAnimals(); window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(()=>{ AU.complete(); completeSheet(S.locIdx); checkResidents(); }, 500);
};
const demoReset = ()=>{ const snd=S.sound; S = freshState(); S.seenIntro=true; S.sound=snd; save(); renderAll(); rebuildAnimals(); toast('بدأت من جديد بواحة فارغة'); };
$('pageBody').addEventListener('click', e=>{ const b=e.target.closest('[data-loc]'); if(b && !b.disabled){ S.viewLoc=Number(b.dataset.loc); save(); closePage(); renderAll(); rebuildAnimals(); return; } const r=e.target.closest('[data-res]'); if(r) residentSheet(r.dataset.res); });
function showTab(){ closePage(); }
function openPage(kind){
  $('pageTitle').textContent = kind==='map' ? 'رحلتك' : 'سكان واحاتك';
  $('pageBody').innerHTML = kind==='map'
    ? '<p>أكمل كل واحة لتفتح المكان التالي ونباتاته الجديدة. الواحات المكتملة تبقى لك دائمًا.</p><ol class="journey" id="journey"></ol>'
    : '<div class="rhead"><span></span><span id="resCount"></span></div><p>كل ساكن يأتي حين تحقق واحتك شرطه. اضغط على أي بطاقة لتعرف المزيد.</p><div class="rgrid" id="rgrid"></div>';
  $('page').hidden = false; renderMap(); renderResidents(); $('pageClose').focus();
}
function closePage(){ $('page').hidden = true; $('pageBody').innerHTML=''; }
$('pageClose').onclick = closePage;
$('mapBtn').onclick = ()=>openPage('map');
$('resBtn').onclick = ()=>openPage('res');
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('page').hidden && $('sheet').hidden) closePage(); });
function menuSheet(){
  openSheet('<h2>أدوات التجربة</h2><p>لتجربة النموذج بسرعة فقط، ولن تكون في التطبيق.</p><div class="menu-list">'+
    '<button data-m="day">☀️<div>يوم جديد<span>ابدأ يومًا جديدًا بعادات جديدة</span></div></button>'+
    '<button data-m="studio">🖼️<div>استوديو الصور الواقعية<span>جرّب صورًا حقيقية للنباتات والخلفيات</span></div></button>'+
    '<button data-m="give">🌱<div>خمس بذور وعشر قطرات<span>للغرس والسقي بسرعة</span></div></button>'+
    '<button data-m="fill">🌴<div>إكمال الواحة فورًا<span>شاهد الاحتفال والانتقال للمكان التالي</span></div></button>'+
    '<button data-m="reset">↺<div>إعادة البدء من الصفر<span>واحة فارغة من جديد</span></div></button></div><button class="secondary" id="mClose">إغلاق</button>');
  $('mClose').onclick = closeSheet;
  $('sheetBody').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const m=b.dataset.m; closeSheet();
    if(m==='day') nextDay(); else if(m==='studio') studioSheet(); else if(m==='give') demoGive(); else if(m==='fill') demoFill(); else demoReset(); });
}
$('menuBtn').onclick = menuSheet;
const drawer = $('drawer');
function syncDrawerH(){ document.documentElement.style.setProperty('--dh', drawer.offsetHeight+'px'); }
function setDrawer(open){ drawer.classList.toggle('open', open); $('drawerHandle').setAttribute('aria-expanded', open); syncDrawerH(); }
let dragY = null;
$('drawerHandle').addEventListener('pointerdown', e=>{ dragY = e.clientY; });
$('drawerHandle').addEventListener('pointerup', e=>{ if(dragY==null) return; const dy = e.clientY - dragY; dragY = null;
  if(dy < -24) setDrawer(true); else if(dy > 24) setDrawer(false); else setDrawer(!drawer.classList.contains('open')); });
$('drawerHandle').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setDrawer(!drawer.classList.contains('open')); } });
if(window.ResizeObserver) new ResizeObserver(syncDrawerH).observe(drawer);
syncDrawerH();
function flyReward(src, kind, delay){
  const target = kind==='seed' ? $('cSeeds') : kind==='drop' ? $('cDrops') : $('cLanterns');
  if(!src || !target || RM || !document.body.contains(src) || !src.getClientRects().length) return;
  const a = src.getBoundingClientRect(), b = target.getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'fly'; el.innerHTML = kind==='seed' ? ICON.seed : kind==='drop' ? ICON.drop : ICON.lantern;
  const x0 = a.left+a.width/2, y0 = a.top+a.height/2, x1 = b.left+b.width/2, y1 = b.top+b.height/2;
  el.style.left = x0+'px'; el.style.top = y0+'px'; el.style.opacity = 0; document.body.appendChild(el);
  const mx = (x1-x0)*.35, my = Math.min(y1, y0) - y0 - 90;
  const an = el.animate([{transform:'translate(0,0) scale(.6)', opacity:0},{transform:'translate(0,-20px) scale(1.25)', opacity:1, offset:.18},{transform:'translate('+mx+'px,'+my+'px) scale(1.1)', opacity:1, offset:.55},{transform:'translate('+(x1-x0)+'px,'+(y1-y0)+'px) scale(.7)', opacity:.9}],
    {duration:900, delay:delay||0, easing:'cubic-bezier(.35,.1,.3,1)', fill:'forwards'});
  an.onfinish = ()=>{ el.remove(); target.classList.remove('bump'); void target.offsetWidth; target.classList.add('bump'); AU.drip(.035); };
}
$('notif').addEventListener('click', ()=>{ const id=$('notif').dataset.id; clearTimeout(nT); NQ.length=0; hideNotif(); if(id==='*') openPage('res'); else residentSheet(id); });

// first gesture can resume audio if the user chose sound earlier
if(S.sound){ const resume = ()=>{ if(S.sound) AU.set(true); renderScene(); window.removeEventListener('pointerdown', resume); }; window.addEventListener('pointerdown', resume); }

S.seen = S.seen || {};
S.oases.forEach((oa,i)=>{ if(!oa) return; oa.res = oa.res || []; const n=LOCS[i].plots, pool=LOCS[i].plants;
  for(let k=oa.plots.length;k<n;k++) oa.plots.push(oa.complete ? {plant:pool[k%pool.length], stage:2} : null);
  oa.plots.forEach(p=>{ if(p && !PLANTS[p.plant]) p.plant = pool[0]; });
  if(oa.complete && !oa.res.length) RESIDENTS.forEach(R=>{ if(resCond(R.id,oa,i)){ oa.res.push(R.id); S.seen[R.id]=true; } }); });
save(); rebuildAnimals();
setTimeout(()=>{ if(S.seenIntro) checkResidents(); }, 1600);
DB.open().then(()=>DB.all()).then(all=>{ Object.assign(ART, all); bgKey=''; renderAll(); rebuildAnimals(); });
renderAll(); rebuildAnimals();
if(!S.seenIntro) setTimeout(introSheet, 300);
})();
</script>
</body>
</html>
