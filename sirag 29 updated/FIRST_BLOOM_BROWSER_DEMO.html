</style></head><body><canvas id="view"></canvas><div id="hud"><small>BATL MUSLIM · THE FIRST BLOOM</small><b id="status">A seed of possibility</b></div><div id="caption">Drag to explore · The flower remembers</div><div id="fallback">This device could not initialize the 3D scene.<br>Try the latest Expo Go or a modern browser.</div><script>
(function(){'use strict';
const canvas=document.getElementById('view'), gl=canvas.getContext('webgl',{antialias:true,alpha:false,powerPreference:'high-performance'});if(!gl){document.getElementById('fallback').style.display='flex';return;}
const V=`attribute vec3 p;attribute vec3 n;attribute vec3 c;uniform mat4 vp;uniform float time;varying vec3 normal;varying vec3 color;varying vec3 world;void main(){world=p;normal=n;color=c;gl_Position=vp*vec4(p,1.);}`;
const F=`precision mediump float;varying vec3 normal;varying vec3 color;varying vec3 world;uniform vec3 eye;uniform float time;uniform float bloom;void main(){vec3 n=normalize(normal);vec3 l=normalize(vec3(-0.5,1.0,0.8));float diffuse=max(dot(n,l),0.0);float rim=pow(1.-max(dot(n,normalize(eye-world)),0.),2.5);float spec=pow(max(dot(reflect(-l,n),normalize(eye-world)),0.),35.);vec3 col=color*(0.28+0.9*diffuse)+vec3(1.,0.78,0.38)*(spec*0.58+rim*(0.18+0.3*bloom));float fog=clamp((length(world-eye)-3.5)/12.,0.,0.65);col=mix(col,vec3(0.025,0.095,0.077),fog);gl_FragColor=vec4(pow(col,vec3(0.9)),1.);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,V));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,F));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const pos=gl.getAttribLocation(prog,'p'),norm=gl.getAttribLocation(prog,'n'),col=gl.getAttribLocation(prog,'c');const vpU=gl.getUniformLocation(prog,'vp'),eyeU=gl.getUniformLocation(prog,'eye'),timeU=gl.getUniformLocation(prog,'time'),bloomU=gl.getUniformLocation(prog,'bloom');const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);for(const [i,a] of [[pos,0],[norm,12],[col,24]]){gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,36,a)}
const verts=[];const push=(p,n,c)=>verts.push(...p,...n,...c);const tri=(a,b,c,color)=>{const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];let l=Math.hypot(...n)||1;n=n.map(x=>x/l);push(a,n,color);push(b,n,color);push(c,n,color)};
function sphere(x,y,z,r,c,lat=8,lon=12){for(let i=0;i<lat;i++)for(let j=0;j<lon;j++){let a=i*Math.PI/lat,b=(i+1)*Math.PI/lat,d=j*2*Math.PI/lon,e=(j+1)*2*Math.PI/lon;let f=(t,h)=>[x+r*Math.sin(t)*Math.cos(h),y+r*Math.cos(t),z+r*Math.sin(t)*Math.sin(h)];tri(f(a,d),f(b,d),f(b,e),c);tri(f(a,d),f(b,e),f(a,e),c)}}
function stem(height){const slices=22,sides=9;for(let i=0;i<slices;i++){let y=i/slices*height,yn=(i+1)/slices*height;for(let j=0;j<sides;j++){let a=j*2*Math.PI/sides,b=(j+1)*2*Math.PI/sides;const f=(Y,t)=>[0.045*Math.cos(t)+Math.sin(Y*1.4)*0.045,Y-0.2,0.045*Math.sin(t)];let color=[0.13+Ylight(y)*0.06,0.35+Ylight(y)*0.15,0.24];tri(f(y,a),f(yn,a),f(yn,b),color);tri(f(y,a),f(yn,b),f(y,b),color)}}}function Ylight(y){return Math.min(1,y/1.4)}
function petal(angle,open,height,scale,shade){const segments=17,width=9;let center=[Math.sin(angle),0,Math.cos(angle)];const right=[Math.cos(angle),0,-Math.sin(angle)];let layers=[];for(let i=0;i<=segments;i++){const t=i/segments,rad=(0.05+open*(0.85*t*t))*scale,yy=height+(t*0.62-open*t*t*0.39)*scale;let row=[];for(let j=0;j<=width;j++){let u=(j/width*2-1),w=(Math.sin(Math.PI*t)**0.75)*0.30*scale*u;let curl=(u*u)*0.11*Math.sin(Math.PI*t);row.push([center[0]*rad+right[0]*w,yy+curl,center[2]*rad+right[2]*w])}layers.push(row)}for(let i=0;i<segments;i++)for(let j=0;j<width;j++){let t=(i+0.5)/segments,u=(j+0.5)/width;const color=[0.15+0.44*(1-t)+shade*0.1,0.48+0.30*t,0.38+0.12*Math.sin(u*Math.PI)];tri(layers[i][j],layers[i+1][j],layers[i+1][j+1],color);tri(layers[i][j],layers[i+1][j+1],layers[i][j+1],color)}}
function leaf(angle,y,scale){const a=[Math.cos(angle),0,Math.sin(angle)],right=[-a[2],0,a[0]];for(let i=0;i<10;i++){const t=i/10,tn=(i+1)/10;const point=(v,side)=>[a[0]*(v*scale)+right[0]*Math.sin(Math.PI*v)*0.17*scale*side, y+0.14*v-0.15*v*v,a[2]*(v*scale)+right[2]*Math.sin(Math.PI*v)*0.17*scale*side];tri(point(t,0),point(tn,0),point(tn,1),[0.14,0.42,0.29]);tri(point(t,0),point(tn,1),point(t,1),[0.16,0.48,0.30]);tri(point(t,0),point(tn,-1),point(tn,0),[0.1,0.34,0.23]);tri(point(t,0),point(t,-1),point(tn,-1),[0.1,0.34,0.23])}}
function ground(){const n=30;for(let i=0;i<n;i++)for(let j=0;j<n;j++){let x=-3+i*6/n,z=-3+j*6/n,step=6/n;let h=(x,z)=>-0.27+0.055*Math.sin(x*4+z*3)*Math.cos(z*5);let c=[0.075+0.018*Math.sin(i+j),0.21+0.018*Math.cos(i*3),0.15];tri([x,h(x,z),z],[x+step,h(x+step,z),z],[x+step,h(x+step,z+step),z+step],c);tri([x,h(x,z),z],[x+step,h(x+step,z+step),z+step],[x,h(x,z+step),z+step],c)}}
function stone(){for(let k=0;k<10;k++){let a=k*Math.PI*2/10,r=1.6+(k%3)*0.14;const x=Math.cos(a)*r,z=Math.sin(a)*r;sphere(x,-0.19,z,0.12,[0.19,0.26,0.21],5,7)}}
function particles(t,open){for(let i=0;i<36;i++){let a=i*2.399963,rr=0.4+(i%9)*0.14,x=Math.cos(a+t*0.17)*rr,z=Math.sin(a+t*0.17)*rr,y=((i*0.37+t*(0.15+(i%3)*0.04))%2.4)-0.15;let r=0.009+(i%3)*0.003;sphere(x,y,z,r,[0.65+open*0.22,0.48+open*0.22,0.22],4,5)}}
function makeScene(t,progress){verts.length=0;ground();stone();const grow=Math.max(0,Math.min(1,(progress-0.16)/0.40));const opening=Math.max(0,Math.min(1,(progress-0.52)/0.37));const ease=x=>x*x*(3-2*x);const h=0.07+grow*1.25;stem(h);if(grow>0.12){leaf(0.8,h*0.48,0.55*grow);leaf(3.7,h*0.63,0.46*grow)}if(grow>0.35){for(let i=0;i<7;i++)petal(i*Math.PI*2/7+0.2,ease(opening),h-0.04,0.85, i/7);for(let i=0;i<5;i++)petal(i*Math.PI*2/5+0.4,ease(opening)*0.67,h+0.01,0.57,i/5);sphere(0,h+0.1,0,0.09+0.045*opening,[0.93,0.67,0.25],8,12)}else sphere(0,h-0.04,0,0.085,[0.32,0.54,0.35]);particles(t,opening);}
const M={};function perspective(fov,aspect,near,far){let f=1/Math.tan(fov/2),o=new Float32Array(16);o[0]=f/aspect;o[5]=f;o[10]=(far+near)/(near-far);o[11]=-1;o[14]=2*far*near/(near-far);return o}function lookAt(eye,target){let z=norm3(sub(eye,target)),x=norm3(cross([0,1,0],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1])}function mul(a,b){let o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[i+j*4]+=a[i+k*4]*b[k+j*4];return o}function sub(a,b){return a.map((v,i)=>v-b[i])}function dot(a,b){return a.reduce((v,x,i)=>v+x*b[i],0)}function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function norm3(a){let l=Math.hypot(...a)||1;return a.map(v=>v/l)}
let progress=0,playing=false,start=0,duration=12000,angle=0.4,tilt=0.22,drag=false,lastX=0,lastY=0,freeze=false,ready=false;
function send(type,extra){try{window.ReactNativeWebView&&window.ReactNativeWebView.postMessage(JSON.stringify({type,...extra}))}catch(e){}}
window.BatlBloom={start:function(){progress=0;playing=true;start=performance.now();send('started')},restore:function(v){playing=false;progress=v?1:0;document.getElementById('status').textContent=v?'Your flower is alive':'A seed of possibility'},replay:function(){this.start()},reducedMotion:function(v){freeze=!!v}};
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;angle+=(e.clientX-lastX)*0.008;tilt=Math.max(-0.15,Math.min(0.75,tilt+(e.clientY-lastY)*0.004));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);
function draw(now){requestAnimationFrame(draw);if(document.hidden)return;const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(window.devicePixelRatio||1,1.6);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);gl.viewport(0,0,canvas.width,canvas.height)}
if(playing){progress=freeze?1:Math.min(1,(now-start)/duration);if(progress>=1){playing=false;document.getElementById('status').textContent='The first bloom';send('finished')}else document.getElementById('status').textContent=progress<0.2?'The awakening':progress<0.53?'The growth':progress<0.87?'The bloom':'The reveal'}
const t=now/1000;makeScene(t,progress);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.DYNAMIC_DRAW);gl.clearColor(0.025,0.085,0.07,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.disable(gl.CULL_FACE);const cinematic=playing?0.22*Math.sin(progress*Math.PI):0;const eye=[Math.sin(angle+cinematic)*3.5,1.65+tilt,Math.cos(angle+cinematic)*3.5];gl.uniformMatrix4fv(vpU,false,mul(perspective(Math.PI/3,w/h,0.1,100),lookAt(eye,[0,0.48,0])));gl.uniform3fv(eyeU,new Float32Array(eye));gl.uniform1f(timeU,t);gl.uniform1f(bloomU,progress);gl.drawArrays(gl.TRIANGLES,0,verts.length/9);if(!ready){ready=true;send('ready')}}requestAnimationFrame(draw);
window.addEventListener('message',e=>{try{const data=JSON.parse(e.data);if(data.type==='start')window.BatlBloom.start();if(data.type==='restore')window.BatlBloom.restore(data.bloomed);if(data.type==='replay')window.BatlBloom.replay();if(data.type==='reducedMotion')window.BatlBloom.reducedMotion(data.value)}catch(e){}});document.addEventListener('message',e=>{try{const d=JSON.parse(e.data);if(d.type==='start')window.BatlBloom.start();if(d.type==='restore')window.BatlBloom.restore(d.bloomed);if(d.type==='replay')window.BatlBloom.replay();if(d.type==='reducedMotion')window.BatlBloom.reducedMotion(d.value)}catch(e){}});
})();
