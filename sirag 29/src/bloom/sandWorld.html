(()=>{'use strict';const cv=document.getElementById('world'),hud=document.getElementById('hud'),progress=document.getElementById('progress'),fill=document.getElementById('fill'),skip=document.getElementById('skip');const gl=cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'high-performance'});function send(type,extra={}){window.ReactNativeWebView?.postMessage(JSON.stringify({type,...extra}))}if(!gl){send('sceneError',{message:'WebGL unavailable on device'});return}
const vs=`attribute vec2 a;varying vec2 uv;void main(){uv=a;gl_Position=vec4(a,0.,1.);}`;
const fs=`precision highp float;varying vec2 uv;uniform vec2 resolution;uniform float time;uniform vec3 eye;uniform float yaw;uniform float pitch;uniform float growth;uniform float care;uniform float stage;uniform float water;uniform float hasPalm;uniform float hasPath;uniform float hasFountain;uniform vec4 positions[24];uniform float plantCount;

vec2 map(vec3 p){float d=p.y-height(p.xz);float material=1.;float lake=length((p.xz-vec2(-2.8,8.5))*vec2(1.,.8));if((growth>1.||hasFountain>.5)&&lake<2.3){float pond=p.y-(.08+height(p.xz)*.15);if(pond<d){d=pond;material=4.;}}
for(int i=0;i<24;i++){if(float(i)>=plantCount)break;vec4 q=positions[i];float x=q.x,z=q.y,s=q.z;vec3 base=vec3(x,height(vec2(x,z)),z);float stem=capsule(p,base,base+vec3(0.,.23+1.35*s,0.),.035+.055*s);if(stem<d){d=stem;material=2.;}for(int j=0;j<6;j++){float a=float(j)*1.0472+float(i);float h=.3+1.0*s;vec3 start=base+vec3(0.,h,0.);vec3 end=start+vec3(cos(a)*(.25+.75*s),-.18-.22*s,sin(a)*(.25+.75*s));float leaf=capsule(p,start,end,.035+.13*s*(1.-abs(dot(normalize(end-start),normalize(p-start)))*.2));if(leaf<d){d=leaf;material=3.;}}if(s>.85){float blossom=length((p-base-vec3(0.,1.63*s,0.))*vec3(1.,1.2,1.))-(.12+.12*s);if(blossom<d){d=blossom;material=5.;}}}

let zoom=1,frameAvg=16,lastFrame=0,plants=[],active=0,built=[],lang='ar',mode='explore',stage=0,progressValue=0,careTouches=0,cin=0,prev=performance.now(),cam={x:0,y:2.3,z:-4,yaw:.03,pitch:-.19},drag=null,lookDelta=0;function say(en,ar){hud.textContent=lang==='ar'?ar:en}function resize(){const d=Math.min(devicePixelRatio||1,0.85),w=Math.max(1,Math.round(innerWidth*d)),h=Math.max(1,Math.round(innerHeight*d));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}}function complete(){activityCanvas.style.display='none';mode='cinematic';cin=0;progress.style.display='none';skip.style.display='block';send('careComplete',{stage});say('Watch your oasis grow','شاهد واحتك تنمو')}function render(now){if(lastFrame&&now-lastFrame<25){requestAnimationFrame(render);return}lastFrame=now;resize();const dt=Math.min(.05,(now-prev)/1000);prev=now;if(mode==='cinematic'){cin+=dt/0.85;if(cin>=1){mode='explore';skip.style.display='none';send('growthFinished',{stage});say('Drag to explore · pinch to zoom · tap plants','اسحب للاستكشاف · قرّب بإصبعين · المس النباتات')}}gl.uniform2f(loc.resolution,cv.width,cv.height);gl.uniform1f(loc.time,now*.001);gl.uniform3f(loc.eye,cam.x,cam.y,cam.z);gl.uniform1f(loc.yaw,cam.yaw);gl.uniform1f(loc.pitch,cam.pitch);gl.uniform1f(loc.growth,plants.reduce((a,p)=>a+(p.stage||0),0));gl.uniform1f(loc.care,progressValue);gl.uniform1f(loc.stage,stage);gl.uniform1f(loc.water,stage===3?progressValue:0);gl.uniform1f(loc.hasPalm,built.includes('palm')?1:0);gl.uniform1f(loc.hasPath,built.includes('path')?1:0);gl.uniform1f(loc.hasFountain,built.includes('fountain')?1:0);let data=new Float32Array(96);plants.slice(0,24).forEach((p,i)=>{data[i*4]=p.x;data[i*4+1]=p.z;data[i*4+2]=Math.max(.08,(p.stage||0)/5);data[i*4+3]=0});if(mode!=='explore'&&plants[active]){data[active*4+2]=Math.max(.08,((stage-1)+Math.min(1,cin))/5)}gl.uniform4fv(loc.positions,data);gl.uniform1f(loc.plantCount,Math.min(24,plants.length));gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAni const touches=new Map();let pinchDistance=0;function adjustZoom(delta){zoom=Math.max(.65,Math.min(2.7,zoom+delta));cam.y=Math.max(1.05,Math.min(6.0,1.7*zoom));}function resetCamera(){zoom=1.8;cam.x=0;cam.y=3.1;cam.z=-6.2;cam.yaw=.03;cam.pitch=-.30;mode='explore';say('Pinch or use + / − to zoom · drag to explore','قرّب أو بعّد بإصبعين · اسحب للاستكشاف')}document.getElementById('zoomIn').onclick=()=>adjustZoom(-.22);document.getElementById('zoomOut').onclick=()=>adjustZoom(.22);document.getElementById('overview').onclick=resetCamera;cv.addEventListener('pointerdown',e=>{e.preventDefault();touches.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,travel:0};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2&&mode==='explore'){const a=[...touches.values()];const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchDistance)adjustZoom((pinchDistance-dist)*.006);pinchDistance=dist;return}const dx=e.clientX-drag.lx,dy=e.clientY-drag.ly;drag.travel+=Math.hypot(dx,dy);drag.lx=e.clientX;drag.ly=e.clientY;if(mode==='explore'){if(drag.x<innerWidth*.35){const speed=.016;cam.x=Math.max(-15,Math.min(15,cam.x+Math.sin(cam.yaw)*-dy*speed+Math.cos(cam.yaw)*dx*speed));cam.z=Math.max(-14,Math.min(24,cam.z+Math.cos(cam.yaw)*-dy*speed-Math.sin(cam.yaw)*dx*speed))}else{cam.yaw-=dx*.005;cam.pitch=Math.max(-.65,Math.min(.18,cam.pitch+dy*.003))}}else if(mode==='care'&&stage===2){progressValue=Math.min(1,progressValue+Math.hypot(dx,dy)/110)}else if(mode==='care'&&stage===3){progressValue=Math.min(1,progressValue+Math.max(0,-dy)/95)}if(mode==='care'){fill.style.width=Math.round(progressValue*100)+'%';if(progressValue>=1)complete()}});cv.addEventListener('pointerup',e=>{touches.delete(e.pointerId);pinchDistance=0;if(!drag)return;if(mode==='care'&&[1,4,5].includes(stage)){careTouches++;progressValue=Math.min(1,careTouches actx.clearRect(0,0,w,h);const bg=actx.createLinearGradient(0,h*.22,0,h);bg.addColorStop(0,'rgba(24,28,20,0.0)');bg.addColorStop(.3,'rgba(65,43,24,.88)');bg.addColorStop(1,'rgba(51,34,20,.97)');actx.fillStyle=bg;actx.fillRect(0,0,w,h);

if(stage===1){ // Moving shovel, accumulating sand mound, growing hole.
 const tx=activityDrag?.x??cx+r*.7,ty=activityDrag?.y??cy-55;

} else if(stage===2){ellipse(activitySeed.x,activitySeed.y,12,18,'#694322');ellipse(activitySeed.x-3,activitySeed.y-4,4,9,'#b08a52');if(q>0.6)ellipse(cx,cy+34,12,17,'#694322')
}else if(stage===3){ellipse(cx,cy+25,r*.60*q,r*.25*q,'#d5ac70');if(q<.9)ellipse(cx,cy+34,11,15,'#6b4526')
}else if(stage===4){ellipse(cx,cy+38,r*(.3+.6*q),r*(.15+.26*q),'rgba(59,48,30,.70)');actx.save();actx.translate(activityCan.x,activityCan.y);actx.rotate(q*.5);actx.fillStyle='#b3a59a';actx.fillRect(-22,-18,48,38);actx.fillRect(19,-10,29,7);actx.strokeStyle='#c7c3b6';actx.lineWidth=6;actx.strokeRect(-10,-34,27,20);actx.restore();for(const drop of activityDrops){ellipse(drop.x,drop.y,3,8,'#8dd7e7')}
}else if(stage===5){const height=28+q*140;actx.strokeStyle='#477b36';actx.lineWidth=5+q*3;actx.beginPath();actx.moveTo(cx,cy+28);actx.quadraticCurveTo(cx+10,cy-height*.45,cx,cy-height);actx.stroke();for(let i=0;i<5;i++){if(q<i*.17)continue;const y=cy-height*(.25+i*.15),side=i%2?1:-1;actx.save();actx.translate(cx,y);actx.rotate(side*.48);ellipse(side*(12+q*12),0,17+q*15,7+q*5,'#397e39');actx.restore()}if(q>.82){for(let i=0;i<7;i++){const a=i*Math.PI*2/7;ellipse(cx+Math.cos(a)*15,cy-height+Math.sin(a)*15,11,7,'#e9a6ad')}ellipse(cx,cy-height,9,9,'#f0d47d')}
}

actx.fillStyle='rgba(18,38,29,.85)';actx.beginPath();actx.roundRect(22,h*.16,w-44,68,16);actx.fill();actx.fillStyle='#f8e5bc';actx.font='bold 17px system-ui';actx.textAlign='center';const instructions=lang==='ar'?['','اسحب المجرفة لتحفر حفرة حقيقية','اسحب البذرة وضعها داخل الحفرة','اسحب الرمل من الجوانب إلى الوسط','اسحب الإبريق لتسقي التربة','مرر إصبعك على البرعم لينمو']:['','Drag the shovel to dig','Drag the seed into the hole','Push sand into the hole','Drag the watering can to pour','Brush the sprout to grow'];actx.fillText(instructions[stage],w/2,h*.16+28);actx.fillStyle='#d8b982';actx.fillRect(42,h*.16+47,(w-84)*q,5);
}
function activityPoint(e){return{x:e.clientX,y:e.clientY}}
activityCanvas.addEventListener('pointerdown',e=>{if(mode!=='care'||activityDone)return;e.preventDefault();const p=activityPoint(e);activityDrag={...p,lastX:p.x,lastY:p.y};activityCanvas.setPointerCapture(e.pointerId);if(stage===2){activitySeed={x:p.x,y:p.y}}if(stage===4){activityCan={x:p.x,y:p.y}}activityDraw()});
